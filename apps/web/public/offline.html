<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — VANRAKSHA AI</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0d0d0d; color: #fff; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 32rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
      p { color: #c3c2b7; font-size: 0.875rem; line-height: 1.6; margin: 0 0 0.5rem; }
      a {
        display: inline-block; margin-top: 1.5rem; padding: 0.75rem 1.25rem;
        background: #3987e5; color: #fff; text-decoration: none; border-radius: 0.5rem;
        font-size: 0.875rem; font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Reports you have already saved on this device are safe. They will be sent
        automatically as soon as there is a connection.
      </p>
      <p>Nothing has been lost.</p>
      <a href="/report">Open the reporting form</a>
    </main>
  </body>
</html>
